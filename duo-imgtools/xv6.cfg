image boot.vfat {
    vfat {
        files = {
            "fip.bin",
            "boot.sd"
        }
    }
    size = 64M
}

image rootfs.ext2 {
    ext2 {
        extraargs = "-d rootfs_dir"
    }
    size = 32M
}

image milkv-duo_sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext2"
    }
}
